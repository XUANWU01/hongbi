version: "3.8"
services:
  hongbi:
    build: .
    container_name: hongbi
    ports:
      - "${PORT:-8712}:8712"
    volumes:
      - hongbi_data:/app/server/data
    environment:
      - PORT=8712
      - HOST=0.0.0.0
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-100}
      - MAX_QUESTIONS=${MAX_QUESTIONS:-20000}
      - HONGBI_ADMIN_KEY=${HONGBI_ADMIN_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8712/api/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  hongbi_data:
    driver: local
