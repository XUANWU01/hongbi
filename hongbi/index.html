<!DOCTYPE html>

<head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/home" aria-label="红笔首页">
      <span class="brand-mark">红</span>
      <span class="brand-name">红笔<em>HONGBI</em></span>
    </a>
    <nav class="mainnav" id="mainnav" aria-label="主导航">
      <a href="#/home" data-nav="home">工作台</a>
      <a href="#/library" data-nav="library">题库广场</a>
      <a href="#/mine" data-nav="mine">我的题库</a>
      <a href="#/wrong" data-nav="wrong">错题本<span class="nav-badge" id="wrong-badge" hidden></span></a>
      <a href="#/fav" data-nav="fav">收藏</a>
    </nav>
    <span class="server-pill offline" id="server-pill" title="未连接服务器">本地模式</span>
    <button class="btn btn-ghost btn-sm theme-btn" id="theme-btn" data-action="theme-toggle" aria-label="切换深浅色" title="切换深浅色">☾</button>
    <a class="btn btn-primary btn-upload" href="#/upload">＋ 上传题库</a>

</header>

<main id="view" class="view" tabindex="-1"></main>

<nav class="bottom-nav" aria-label="移动端导航">
  <a href="#/home" data-nav="home"><span>🏠</span>工作台</a>
  <a href="#/library" data-nav="library"><span>📚</span>广场</a>

  <a href="#/wrong" data-nav="wrong"><span>✗</span>错题</a>
</nav>

<footer class="footer">
  <p>红笔 v2 · 本地优先 + 云端共享 —— 个人数据在你的浏览器，公共题库在服务器。</p>
  <p class="footer-note">共享协议：上传时你可选择把题库合并进「公共主题库」供有同样需求的人使用，或存入仅自己可见的私库。</p>
</footer>

<div id="modal-root"></div>

<script src="js/core.js"></script>

<script src="js/app.js"></script>
