<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="description" content="红笔 v3 · 服务器化刷题平台：上传题库、共享审核、跨设备进度同步。">
<title>红笔 · 刷题平台 v3</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111827'/%3E%3Ctext x='16' y='24' font-size='18' text-anchor='middle' fill='%2363e2ff' font-family='serif' font-weight='900'%3E红%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow bg-glow-a" aria-hidden="true"></div>
<div class="bg-glow bg-glow-b" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/home" aria-label="红笔首页">
      <span class="brand-mark">红</span>
      <span class="brand-name">HONGBI<em>·刷题平台</em></span>
    </a>
    <nav class="mainnav" id="mainnav" aria-label="主导航">
      <a href="#/home" data-nav="home">工作台</a>
      <a href="#/library" data-nav="library">题库广场</a>
      <a href="#/mine" data-nav="mine">我的题库</a>
      <a href="#/wrong" data-nav="wrong">错题本<span class="nav-badge" id="wrong-badge" hidden></span></a>
      <a href="#/fav" data-nav="fav">收藏</a>
      <a href="#/admin" data-nav="admin" id="admin-nav" hidden>审核队列<span class="nav-badge" id="review-badge" hidden></span></a>
    </nav>
    <div class="top-actions">
      <span class="conn-dot" id="conn-dot" title="服务器连接状态"></span>
      <button class="btn btn-ghost btn-sm" id="auth-btn" data-action="open-auth">登录</button>
    </div>
    <a class="btn btn-primary btn-upload" href="#/upload">＋ 上传题库</a>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<nav class="bottom-nav" aria-label="移动端导航">
  <a href="#/home" data-nav="home"><span>◈</span>工作台</a>
  <a href="#/library" data-nav="library"><span>▦</span>广场</a>
  <a href="#/upload" data-nav="upload"><span class="bn-add">＋</span>上传</a>
  <a href="#/mine" data-nav="mine"><span>▤</span>我的</a>
  <a href="#/wrong" data-nav="wrong"><span>✗</span>错题</a>
</nav>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="js/core.js"></script>
<script src="js/api.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
